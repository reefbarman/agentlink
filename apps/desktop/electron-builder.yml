appId: com.agentlink.desktop
productName: AgentLink
asar: true
asarUnpack:
  - "**/*.node"
npmRebuild: false
compression: maximum
# ${os} is "mac" or "linux", so mac names are unchanged.
artifactName: AgentLink-Desktop-${version}-${os}-${arch}.${ext}
directories:
  app: .
  output: ../../../desktop-releases
files:
  - dist/**/*
  - node_modules/**/*
  - package.json
extraResources:
  - from: runtime
    to: runtime
mac:
  category: public.app-category.productivity
  icon: ../assets/icon.png
  identity: null # Non-MAS Apple Development is signed by afterPack in development mode.
  # Required for composer dictation; macOS denies microphone access without it.
  # A hardened runtime would also need the com.apple.security.device.audio-input entitlement.
  extendInfo:
    NSMicrophoneUsageDescription: AgentLink uses the microphone when you dictate a message with the composer mic button.
    # Shown when macOS asks for Local Network access, needed to reach a
    # self-hosted Assistant on the LAN (for example https://agentlink-assistant.local:8443).
    NSLocalNetworkUsageDescription: AgentLink connects to your self-hosted AgentLink Assistant and other AgentLink services on your local network.
  target:
    - dmg
    - zip
dmg:
  sign: false
toolsets:
  # The static AppImage runtime. The legacy one (0.0.0) needs libfuse2 and the
  # unversioned libz.so, which Ubuntu 24.04 and other current distros do not
  # install, and its launcher entry silently adds --no-sandbox.
  appimage: "1.0.3"
linux:
  executableName: agentlink
  # Window association: Electron uses package.json desktopName (set by
  # package.mjs) as the Wayland app_id and X11 WM_CLASS.
  syncDesktopName: true
  icon: ../assets/icon.png
  category: Utility
  synopsis: AgentLink Desktop chat
  desktop:
    entry:
      Name: AgentLink
  target:
    - AppImage
    - deb
deb:
  packageName: agentlink-desktop
  maintainer: Tristan Cartledge <tristan.cartledge@gmail.com>
  # Installs to /opt/AgentLink. electron-builder's default post-install
  # script installs an AppArmor profile (abi 4.0, `userns`) for
  # /opt/AgentLink/agentlink when the host's AppArmor supports it, so
  # Chromium keeps its renderer sandbox under Ubuntu 23.10+'s unprivileged
  # user namespace restriction; post-remove unloads and deletes it. The
  # AppImage cannot do this and runs with --no-sandbox there.
  # electron-builder's defaults plus the shared libraries Electron links
  # against that a minimal Ubuntu install lacks (libasound2 is
  # libasound2t64 from Ubuntu 24.04 on).
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - libasound2t64 | libasound2
    - libgbm1
    - libdrm2
    - libxkbcommon0
  # The Ask Agent scratch-folder sandbox needs these (see the Linux sandbox
  # check); `which` comes from the essential debianutils.
  recommends:
    - bubblewrap
    - socat
    - ripgrep
