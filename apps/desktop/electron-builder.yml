appId: com.agentlink.desktop
productName: AgentLink
asar: true
asarUnpack:
  - "**/*.node"
npmRebuild: false
compression: maximum
artifactName: AgentLink-Desktop-${version}-mac-${arch}.${ext}
directories:
  app: .
  output: ../../../desktop-releases
files:
  - dist/**/*
  - node_modules/**/*
  - package.json
extraResources:
  - from: runtime
    to: runtime
mac:
  category: public.app-category.productivity
  icon: ../assets/icon.png
  identity: null # Non-MAS Apple Development is signed by afterPack in development mode.
  # Required for composer dictation; macOS denies microphone access without it.
  # A hardened runtime would also need the com.apple.security.device.audio-input entitlement.
  extendInfo:
    NSMicrophoneUsageDescription: AgentLink uses the microphone when you dictate a message with the composer mic button.
  target:
    - dmg
    - zip
dmg:
  sign: false
