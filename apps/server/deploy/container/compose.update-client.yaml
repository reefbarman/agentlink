# Main Assistant's narrow connection to the standalone updater. No Docker
# socket, updater state directory or host-execution endpoint is mounted here.
services:
  assistant:
    networks:
      - updater-control
    secrets:
      - source: updater_token
        target: updater-token

networks:
  updater-control:
    name: agentlink-updater-control
    external: true

secrets:
  updater_token:
    file: ./secrets/updater-token
