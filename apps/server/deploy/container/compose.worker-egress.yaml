# Unrestricted network for commands on the command worker, bypassing the
# egress gateway's allowlist. Prefer adding hosts to AGENTLINK_EGRESS_ALLOW:
# with this overlay commands can reach any internet host AND your LAN and
# the Docker host by address. Add it only if you accept that, with
#   COMPOSE_FILE=compose.yaml:compose.worker-egress.yaml
# in .env (append :compose.meridian.yaml if you use Meridian too).
#
# The network is separate from the assistant's network, so commands still
# cannot reach Meridian or the assistant's published port by name.

services:
  command-worker:
    networks:
      - command-worker
      - worker-egress

networks:
  worker-egress: {}
