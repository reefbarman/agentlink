# AgentLink model bench. Extra arguments are passed through, for example:
#   mise run bench:run --rounds 2
#   mise run bench:prepare multi-file-refactor
#   mise run bench:score --session <session-id>
#   mise run bench:routing --only opus-5.5 --profiles compatibility,reasoning
#   mise run bench:todos --runs 3
# Step-by-step guide: scripts/model-bench/README.md

[tasks."bench:calibrate"]
description = "Check the fixture verifiers against no-change, partial and reference controls"
run = "node scripts/model-bench/bench.mjs calibrate"

[tasks."bench:prepare"]
description = "Reset the fixture work dir for a task and print the prompt to paste into a fresh chat"
run = "node scripts/model-bench/bench.mjs prepare"

[tasks."bench:score"]
description = "Verify the fixture work dir and record an attempt (finds the chat automatically)"
run = "node scripts/model-bench/bench.mjs score"

[tasks."bench:run"]
description = "Run every task for every model in new VS Code chat tabs, in a balanced order, and score them"
run = "node scripts/model-bench/bench.mjs run"

[tasks."bench:sessions"]
description = "List recent AgentLink chat sessions and their IDs"
run = "node scripts/model-bench/bench.mjs sessions"

[tasks."bench:codex-login"]
description = "Check or add the Codex subscription sign-in shared with AgentLink in VS Code"
run = "node scripts/model-bench/bench.mjs codex-login"

[tasks."bench:routing"]
description = "Run the live first-turn routing eval for each model in scripts/model-bench/models.json"
run = "node scripts/model-bench/bench.mjs routing"

[tasks."bench:todos"]
description = "Run the live TODO decision-point eval for each model in scripts/model-bench/models.json"
run = "node scripts/model-bench/bench.mjs todos"

[tasks."bench:report"]
description = "Build the comparison report (HTML charts, Markdown summary, JSON data)"
run = "node scripts/model-bench/bench.mjs report"

[tasks."bench:open"]
description = "Build and open the comparison report"
depends = ["bench:report"]
run = "open telemetry-reports/model-bench/report/index.html"

[tasks."bench:test"]
description = "Run the model bench's own tests"
run = "node --test scripts/model-bench/model-bench.test.mjs"
