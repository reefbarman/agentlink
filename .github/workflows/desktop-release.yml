name: Desktop Release

on:
  push:
    tags:
      - "desktop-v*"
  workflow_call:
    inputs:
      ref:
        description: Exact commit SHA to build and release
        required: true
        type: string
      version:
        description: Desktop version (must match apps/desktop/package.json at ref)
        required: true
        type: string
      publish:
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      version:
        description: Desktop version to package (must match apps/desktop/package.json)
        required: true
        type: string
      ref:
        description: Commit SHA to build (defaults to the selected branch head)
        required: false
        type: string
      publish:
        description: Publish artifacts to a GitHub Release
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-15
    env:
      TMPDIR: /private/tmp/
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: npm

      - run: npm ci
      - name: Verify desktop version
        env:
          REQUESTED_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          VERSION=$(node -p 'require("./apps/desktop/package.json").version')
          REQUESTED_VERSION=${REQUESTED_VERSION#desktop-v}
          test "$REQUESTED_VERSION" = "$VERSION"
      - run: npm run lint
      - run: npm test
      - name: Verify VSIX inventory excludes desktop payloads
        run: |
          npx --yes @vscode/vsce@3.9.2 ls --no-dependencies > /tmp/vsix-files.txt
          node scripts/verify-vsix-boundary.mjs --list /tmp/vsix-files.txt

  package:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-15
          - target: darwin-x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: npm

      - run: npm ci

      - name: Extract target native runtimes
        env:
          AGENTLINK_VSCE_TARGET: ${{ matrix.target }}
        run: |
          extract_package() {
            local package_spec=$1
            local pack_dir archive package_name destination
            pack_dir=$(mktemp -d)
            archive=$(npm pack "$package_spec" --pack-destination "$pack_dir" --silent)
            package_name=$(tar -xOf "$pack_dir/$archive" package/package.json | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).name')
            destination="node_modules/$package_name"
            rm -rf "$destination"
            mkdir -p "$destination"
            tar -xzf "$pack_dir/$archive" -C "$destination" --strip-components=1
            rm -rf "$pack_dir"
          }

          LANCEDB_PACKAGE=$(node scripts/package-retrieval-runtime.mjs --print-native-package)
          LANCEDB_VERSION=$(node -p 'require("./package.json").dependencies["@lancedb/lancedb"]')
          KEYCHAIN_PACKAGE=$(node -e 'import("./scripts/package-keychain-runtime.mjs").then(({ KEYCHAIN_NATIVE_PACKAGES }) => process.stdout.write(KEYCHAIN_NATIVE_PACKAGES[process.env.AGENTLINK_VSCE_TARGET]))')
          KEYCHAIN_VERSION=$(node -p 'require("./apps/desktop/package.json").dependencies["@napi-rs/keyring"]')
          extract_package "${LANCEDB_PACKAGE}@${LANCEDB_VERSION}"
          extract_package "${KEYCHAIN_PACKAGE}@${KEYCHAIN_VERSION}"

      - name: Package standalone desktop app
        env:
          AGENTLINK_MAC_SIGNING: unsigned
          AGENTLINK_VSCE_TARGET: ${{ matrix.target }}
        run: |
          npm run build
          npm run package --workspace @agentlink/desktop -- --target "$AGENTLINK_VSCE_TARGET"

      - uses: actions/upload-artifact@v6
        with:
          name: agentlink-desktop-${{ matrix.target }}
          path: |
            desktop-releases/AgentLink-Desktop-*.dmg
            desktop-releases/AgentLink-Desktop-*.zip
            desktop-releases/*.blockmap
          if-no-files-found: error

  release:
    needs: package
    if: github.event_name == 'push' || inputs.publish
    concurrency:
      group: publish-desktop
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      DESKTOP_VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@v7
        with:
          pattern: agentlink-desktop-*
          path: dist
          merge-multiple: true

      - name: Verify release asset set
        run: |
          VERSION=${DESKTOP_VERSION#desktop-v}
          for ARCH in arm64 x64; do
            test -f "dist/AgentLink-Desktop-${VERSION}-mac-${ARCH}.dmg"
            test -f "dist/AgentLink-Desktop-${VERSION}-mac-${ARCH}.dmg.blockmap"
            test -f "dist/AgentLink-Desktop-${VERSION}-mac-${ARCH}.zip"
            test -f "dist/AgentLink-Desktop-${VERSION}-mac-${ARCH}.zip.blockmap"
          done
          ACTUAL_COUNT=$(find dist -maxdepth 1 -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.blockmap' \) | wc -l | tr -d ' ')
          test "$ACTUAL_COUNT" -eq 8

      - name: Generate release update metadata
        run: node scripts/generate-release-update.mjs --product desktop --dir dist

      - name: Publish standalone desktop GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION=${DESKTOP_VERSION#desktop-v}
          TARGET=$(git rev-parse HEAD)
          {
            node scripts/release-coordinator.mjs notes --unit desktop --version "$VERSION" && printf '\n' || true
            printf '%s\n\n' 'Standalone AgentLink Desktop preview for macOS. Install with `curl -fsSL https://raw.githubusercontent.com/reefbarman/agentlink/main/scripts/install.sh | bash -s -- --surface desktop`, or download the DMG matching your Mac: `arm64` for Apple Silicon or `x64` for Intel.'
            printf '%s\n' "This preview is unsigned and not notarized. Prefer the DMG and use **Open** from Finder's context menu on first launch. ZIP files are provided as an advanced fallback and may require removing quarantine with \`xattr -dr com.apple.quarantine AgentLink.app\` after extraction."
          } > notes.md
          node scripts/release-publish.mjs \
            --tag "desktop-v${VERSION}" --target "$TARGET" \
            --title "AgentLink Desktop v${VERSION}" \
            --notes-file notes.md --dir dist --prerelease
