name: Desktop Release

on:
  push:
    tags:
      - "desktop-v*"
  workflow_call:
    inputs:
      ref:
        description: Exact commit SHA to build and release
        required: true
        type: string
      version:
        description: Desktop version (must match apps/desktop/package.json at ref)
        required: true
        type: string
      publish:
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      version:
        description: Desktop version to package (must match apps/desktop/package.json)
        required: true
        type: string
      ref:
        description: Commit SHA to build (defaults to the selected branch head)
        required: false
        type: string
      publish:
        description: Publish artifacts to a GitHub Release
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-15
    env:
      TMPDIR: /private/tmp/
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - name: Verify desktop version
        env:
          REQUESTED_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          VERSION=$(node -p 'require("./apps/desktop/package.json").version')
          REQUESTED_VERSION=${REQUESTED_VERSION#desktop-v}
          test "$REQUESTED_VERSION" = "$VERSION"
      - run: npm run lint
      - run: npm test
      - name: Verify VSIX inventory excludes desktop payloads
        run: |
          npx --yes @vscode/vsce@3.9.2 ls --no-dependencies > /tmp/vsix-files.txt
          node scripts/verify-vsix-boundary.mjs --list /tmp/vsix-files.txt

  package:
    needs: verify
    # Holds the Apple Development certificate. Its deployment policy limits
    # the signing secrets to main and desktop-v* tags.
    environment: desktop-signing
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-15

    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Extract target native runtimes
        env:
          AGENTLINK_VSCE_TARGET: ${{ matrix.target }}
        run: |
          extract_package() {
            local package_spec=$1
            local pack_dir archive package_name destination
            pack_dir=$(mktemp -d)
            archive=$(npm pack "$package_spec" --pack-destination "$pack_dir" --silent)
            package_name=$(tar -xOf "$pack_dir/$archive" package/package.json | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).name')
            destination="node_modules/$package_name"
            rm -rf "$destination"
            mkdir -p "$destination"
            tar -xzf "$pack_dir/$archive" -C "$destination" --strip-components=1
            rm -rf "$pack_dir"
          }

          LANCEDB_PACKAGE=$(node scripts/package-retrieval-runtime.mjs --print-native-package)
          LANCEDB_VERSION=$(node -p 'require("./package.json").dependencies["@lancedb/lancedb"]')
          KEYCHAIN_PACKAGE=$(node -e 'import("./scripts/package-keychain-runtime.mjs").then(({ KEYCHAIN_NATIVE_PACKAGES }) => process.stdout.write(KEYCHAIN_NATIVE_PACKAGES[process.env.AGENTLINK_VSCE_TARGET]))')
          KEYCHAIN_VERSION=$(node -p 'require("./apps/desktop/package.json").dependencies["@napi-rs/keyring"]')
          extract_package "${LANCEDB_PACKAGE}@${LANCEDB_VERSION}"
          extract_package "${KEYCHAIN_PACKAGE}@${KEYCHAIN_VERSION}"

      - name: Import desktop signing certificate
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_DEV_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_DEV_CERT_PASSWORD }}
        run: |
          if [ -z "$MACOS_CERT_P12_BASE64" ] || [ -z "$MACOS_CERT_PASSWORD" ]; then
            echo "::error::MACOS_DEV_CERT_P12_BASE64 and MACOS_DEV_CERT_PASSWORD must be set in the desktop-signing environment."
            exit 1
          fi
          KEYCHAIN="$RUNNER_TEMP/agentlink-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 24)
          CERT="$RUNNER_TEMP/agentlink-signing.p12"
          WWDR="$RUNNER_TEMP/AppleWWDRCAG3.cer"
          printf '%s' "$MACOS_CERT_P12_BASE64" | base64 --decode > "$CERT"
          curl -fsSL https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer -o "$WWDR"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$WWDR" -k "$KEYCHAIN"
          security import "$CERT" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          rm -f "$CERT"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          # Splitting is intended: one argument per existing keychain path.
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          echo "AGENTLINK_SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Package standalone desktop app
        env:
          AGENTLINK_MAC_SIGNING: development
          AGENTLINK_VSCE_TARGET: ${{ matrix.target }}
        run: |
          npm run build
          npm run package --workspace @agentlink/desktop -- --target "$AGENTLINK_VSCE_TARGET"

      - name: Verify release signature
        # Must match DESKTOP_RELEASE_TEAM_ID in apps/desktop/src/desktopReleaseInstall.ts,
        # which the in-app updater checks.
        run: |
          for APP in desktop-releases/mac*/AgentLink.app; do
            codesign --verify --deep --strict \
              '-R=anchor apple generic and identifier "com.agentlink.desktop" and certificate leaf[subject.OU] = "J2896P4NN3"' \
              "$APP"
            codesign -dv "$APP" 2>&1 | grep -E '^(Identifier|TeamIdentifier)='
          done

      - name: Remove signing keychain
        if: always()
        run: |
          if [ -n "${AGENTLINK_SIGNING_KEYCHAIN:-}" ]; then
            security delete-keychain "$AGENTLINK_SIGNING_KEYCHAIN" || true
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: agentlink-desktop-${{ matrix.target }}
          path: |
            desktop-releases/AgentLink-Desktop-*.dmg
            desktop-releases/AgentLink-Desktop-*.zip
            desktop-releases/*.blockmap
          if-no-files-found: error

  release:
    needs: package
    if: github.event_name == 'push' || inputs.publish
    concurrency:
      group: publish-desktop
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      DESKTOP_VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          pattern: agentlink-desktop-*
          path: dist
          merge-multiple: true

      - name: Verify release asset set
        run: |
          VERSION=${DESKTOP_VERSION#desktop-v}
          for ARCH in arm64; do
            test -f "dist/AgentLink-Desktop-${VERSION}-mac-${ARCH}.dmg"
            test -f "dist/AgentLink-Desktop-${VERSION}-mac-${ARCH}.dmg.blockmap"
            test -f "dist/AgentLink-Desktop-${VERSION}-mac-${ARCH}.zip"
            test -f "dist/AgentLink-Desktop-${VERSION}-mac-${ARCH}.zip.blockmap"
          done
          ACTUAL_COUNT=$(find dist -maxdepth 1 -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.blockmap' \) | wc -l | tr -d ' ')
          test "$ACTUAL_COUNT" -eq 4

      - name: Generate release update metadata
        run: node scripts/generate-release-update.mjs --product desktop --dir dist

      - name: Publish standalone desktop GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION=${DESKTOP_VERSION#desktop-v}
          TARGET=$(git rev-parse HEAD)
          {
            node scripts/release-coordinator.mjs notes --unit desktop --version "$VERSION" && printf '\n' || true
            # shellcheck disable=SC2016 # backticks are Markdown, not shell
            printf '%s\n\n' 'Standalone AgentLink Desktop preview for macOS Apple Silicon. Install with `curl -fsSL https://raw.githubusercontent.com/reefbarman/agentlink/main/scripts/install.sh | bash -s -- --surface desktop`, or download the `arm64` DMG. Intel Macs are no longer supported.'
            printf '%s\n' "This preview is signed with an Apple Development certificate (Team ID J2896P4NN3) but not notarised, so macOS still asks you to confirm the first launch. Prefer the DMG and use **Open** from Finder's context menu on first launch. ZIP files are provided as an advanced fallback and may require removing quarantine with \`xattr -dr com.apple.quarantine AgentLink.app\` after extraction."
          } > notes.md
          node scripts/release-publish.mjs \
            --tag "desktop-v${VERSION}" --target "$TARGET" \
            --title "AgentLink Desktop v${VERSION}" \
            --notes-file notes.md --dir dist --prerelease
