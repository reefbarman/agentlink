name: Release

on:
  push:
    tags:
      - "v*"
  workflow_call:
    inputs:
      ref:
        description: Exact commit SHA to build and release
        required: true
        type: string
      version:
        description: Extension version (must match package.json at ref)
        required: true
        type: string
      publish:
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      version:
        description: Extension version to package (must match package.json)
        required: true
        type: string
      ref:
        description: Commit SHA to build (defaults to the selected branch head)
        required: false
        type: string
      publish:
        description: Publish artifacts to a GitHub Release
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: npm

      - name: Install shells used by terminal tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zsh
          /bin/bash --version | head -1
          /bin/zsh --version

      - run: npm ci
      - name: Verify release version
        env:
          REQUESTED_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          REQUESTED_VERSION=${REQUESTED_VERSION#v}
          test "$REQUESTED_VERSION" = "$VERSION"
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm run test:core-sdk-consumer

  package:
    name: Package ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - darwin-arm64
          - darwin-x64
          - linux-arm64
          - linux-x64
          - alpine-arm64
          - alpine-x64
          - win32-arm64
          - win32-x64
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: npm

      - run: npm ci

      - name: Extract target native runtimes
        env:
          AGENTLINK_VSCE_TARGET: ${{ matrix.target }}
        run: |
          extract_package() {
            local package_spec=$1
            local pack_dir archive package_name destination
            pack_dir=$(mktemp -d)
            archive=$(npm pack "$package_spec" --pack-destination "$pack_dir" --silent)
            package_name=$(tar -xOf "$pack_dir/$archive" package/package.json | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).name')
            destination="node_modules/$package_name"
            rm -rf "$destination"
            mkdir -p "$destination"
            tar -xzf "$pack_dir/$archive" -C "$destination" --strip-components=1
            rm -rf "$pack_dir"
          }

          LANCEDB_PACKAGE=$(node scripts/package-retrieval-runtime.mjs --print-native-package)
          LANCEDB_VERSION=$(node -p 'require("./package.json").dependencies["@lancedb/lancedb"]')
          extract_package "${LANCEDB_PACKAGE}@${LANCEDB_VERSION}"

          KEYCHAIN_PACKAGE=$(node -e 'import("./scripts/package-keychain-runtime.mjs").then(({ KEYCHAIN_NATIVE_PACKAGES }) => process.stdout.write(KEYCHAIN_NATIVE_PACKAGES[process.env.AGENTLINK_VSCE_TARGET] ?? ""))')
          if [ -n "$KEYCHAIN_PACKAGE" ]; then
            KEYCHAIN_VERSION=$(node -p 'require("./apps/desktop/package.json").dependencies["@napi-rs/keyring"]')
            extract_package "${KEYCHAIN_PACKAGE}@${KEYCHAIN_VERSION}"
          fi

      - name: Build target bundle
        env:
          AGENTLINK_VSCE_TARGET: ${{ matrix.target }}
        run: npm run build

      - name: Verify package inventory
        env:
          AGENTLINK_VSCE_TARGET: ${{ matrix.target }}
        run: |
          npx --yes @vscode/vsce@3.9.2 ls \
            --no-dependencies \
            | node scripts/verify-retrieval-package.mjs \
                --target "$AGENTLINK_VSCE_TARGET"

      - name: Package VSIX
        env:
          AGENTLINK_VSCE_TARGET: ${{ matrix.target }}
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          npx --yes @vscode/vsce@3.9.2 package \
            --no-dependencies \
            --allow-star-activation \
            --target "$AGENTLINK_VSCE_TARGET" \
            --out "agentlink-${VERSION}-${AGENTLINK_VSCE_TARGET}.vsix"

      - name: Verify packaged VSIX inventory
        env:
          AGENTLINK_VSCE_TARGET: ${{ matrix.target }}
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          unzip -Z1 "agentlink-${VERSION}-${AGENTLINK_VSCE_TARGET}.vsix" \
            | node scripts/verify-retrieval-package.mjs \
                --target "$AGENTLINK_VSCE_TARGET"

      - uses: actions/upload-artifact@v4
        with:
          name: agentlink-${{ matrix.target }}
          path: agentlink-*-${{ matrix.target }}.vsix
          if-no-files-found: error

  release:
    needs: [verify, package]
    if: github.event_name == 'push' || inputs.publish
    # One publisher per unit: a hand-pushed tag or manual dispatch must not
    # replace a draft another run is still uploading.
    concurrency:
      group: publish-vscode
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          pattern: agentlink-*
          path: dist
          merge-multiple: true

      - name: Verify release asset set
        run: |
          VERSION=${RELEASE_VERSION#v}
          TARGETS=(
            darwin-arm64 darwin-x64
            linux-arm64 linux-x64
            alpine-arm64 alpine-x64
            win32-arm64 win32-x64
          )
          for TARGET in "${TARGETS[@]}"; do
            test -f "dist/agentlink-${VERSION}-${TARGET}.vsix"
          done
          ACTUAL_COUNT=$(find dist -maxdepth 1 -type f -name '*.vsix' | wc -l | tr -d ' ')
          test "$ACTUAL_COUNT" -eq "${#TARGETS[@]}"

      - name: Generate release update metadata
        run: node scripts/generate-release-update.mjs --product vscode --dir dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION=${RELEASE_VERSION#v}
          TARGET=$(git rev-parse HEAD)
          if ! node scripts/release-coordinator.mjs notes --unit vscode --version "$VERSION" > notes.md; then
            printf 'See the [changelog](https://github.com/%s/blob/%s/CHANGELOG.md).\n' "$GITHUB_REPOSITORY" "$TARGET" > notes.md
          fi
          node scripts/release-publish.mjs \
            --tag "v${VERSION}" --target "$TARGET" \
            --title "AgentLink v${VERSION}" \
            --notes-file notes.md --dir dist --latest
