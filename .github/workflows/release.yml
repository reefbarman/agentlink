name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: npm

      - run: npm ci
      - name: Verify tag matches package version
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          test "${GITHUB_REF_NAME#v}" = "$VERSION"
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm run test:core-sdk-consumer

  package:
    name: Package ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - darwin-arm64
          - darwin-x64
          - linux-arm64
          - linux-x64
          - alpine-arm64
          - alpine-x64
          - win32-arm64
          - win32-x64
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: npm

      - run: npm ci

      - name: Install target native runtimes
        env:
          AGENTLINK_VSCE_TARGET: ${{ matrix.target }}
        run: |
          LANCEDB_PACKAGE=$(node scripts/package-retrieval-runtime.mjs --print-native-package)
          LANCEDB_VERSION=$(node -p 'require("./package.json").dependencies["@lancedb/lancedb"]')
          KEYCHAIN_PACKAGE=$(node -e 'import("./scripts/package-keychain-runtime.mjs").then(({ KEYCHAIN_NATIVE_PACKAGES }) => process.stdout.write(KEYCHAIN_NATIVE_PACKAGES[process.env.AGENTLINK_VSCE_TARGET] ?? ""))')
          KEYCHAIN_VERSION=$(node -p 'require("./apps/desktop/package.json").dependencies["@napi-rs/keyring"]')
          PACKAGES=("${LANCEDB_PACKAGE}@${LANCEDB_VERSION}")
          if [ -n "$KEYCHAIN_PACKAGE" ]; then
            PACKAGES+=("${KEYCHAIN_PACKAGE}@${KEYCHAIN_VERSION}")
          fi
          npm install --no-save --package-lock=false --force "${PACKAGES[@]}"

      - name: Build target bundle
        env:
          AGENTLINK_VSCE_TARGET: ${{ matrix.target }}
        run: npm run build

      - name: Verify package inventory
        env:
          AGENTLINK_VSCE_TARGET: ${{ matrix.target }}
        run: |
          npx --yes @vscode/vsce@3.9.2 ls \
            --no-dependencies \
            | node scripts/verify-retrieval-package.mjs \
                --target "$AGENTLINK_VSCE_TARGET"

      - name: Package VSIX
        env:
          AGENTLINK_VSCE_TARGET: ${{ matrix.target }}
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          npx --yes @vscode/vsce@3.9.2 package \
            --no-dependencies \
            --allow-star-activation \
            --target "$AGENTLINK_VSCE_TARGET" \
            --out "agentlink-${VERSION}-${AGENTLINK_VSCE_TARGET}.vsix"

      - name: Verify packaged VSIX inventory
        env:
          AGENTLINK_VSCE_TARGET: ${{ matrix.target }}
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          unzip -Z1 "agentlink-${VERSION}-${AGENTLINK_VSCE_TARGET}.vsix" \
            | node scripts/verify-retrieval-package.mjs \
                --target "$AGENTLINK_VSCE_TARGET"

      - uses: actions/upload-artifact@v4
        with:
          name: agentlink-${{ matrix.target }}
          path: agentlink-*-${{ matrix.target }}.vsix
          if-no-files-found: error

  release:
    needs: [verify, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: agentlink-*
          path: dist
          merge-multiple: true

      - name: Verify release asset set
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          TARGETS=(
            darwin-arm64 darwin-x64
            linux-arm64 linux-x64
            alpine-arm64 alpine-x64
            win32-arm64 win32-x64
          )
          for TARGET in "${TARGETS[@]}"; do
            test -f "dist/agentlink-${VERSION}-${TARGET}.vsix"
          done
          ACTUAL_COUNT=$(find dist -maxdepth 1 -type f -name '*.vsix' | wc -l | tr -d ' ')
          test "$ACTUAL_COUNT" -eq "${#TARGETS[@]}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.vsix
          fail_on_unmatched_files: true
          generate_release_notes: true
