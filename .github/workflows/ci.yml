name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  cli-package:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - name: Build standalone CLI preview
        env:
          AGENTLINK_MAC_SIGNING: unsigned
        run: npm run cli:bundle
      - name: Verify packaged CLI launch
        run: |
          cli-releases/agentlink-cli-darwin-arm64/bin/agentlink --help
          cli-releases/agentlink-cli-darwin-arm64/node/bin/node --input-type=module -e 'await import("./cli-releases/agentlink-cli-darwin-arm64/dist/node_modules/@napi-rs/keyring/index.js")'
          node apps/cli/smoke-tui.mjs cli-releases/agentlink-cli-darwin-arm64/bin/agentlink --executable --no-color
      - uses: actions/upload-artifact@v6
        with:
          name: agentlink-cli-darwin-arm64-unsigned
          path: cli-releases/*.tar.gz
          if-no-files-found: error

  # The standalone assistant server on Linux, where it is deployed: its own
  # lint and tests (including the real-process and command-worker tests),
  # then both container images built and smoke-tested under Docker Compose.
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: npm

      - run: npm ci
      - name: Build workspaces and the server bundle
        run: npm run build:workspaces
      - name: Lint apps/server
        run: npm run lint --workspace apps/server
      - name: Test apps/server
        run: npm test --workspace apps/server

      - name: Build container images
        run: |
          docker build -t agentlink-assistant:local \
            -f apps/server/deploy/container/Dockerfile apps/server
          docker build --target command-worker -t agentlink-command-worker:local \
            -f apps/server/deploy/container/Dockerfile apps/server
      - name: Smoke-test the container deployment
        run: apps/server/deploy/container/smoke-test.sh

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: npm

      - name: Install shells used by terminal tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zsh
          /bin/bash --version | head -1
          /bin/zsh --version

      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - name: Verify packed core SDK consumer
        run: npm run test:core-sdk-consumer

      - name: Package and verify a Linux VSIX
        env:
          AGENTLINK_VSCE_TARGET: linux-x64
        run: |
          mkdir -p releases
          npm run package -- "releases/agentlink-ci-${AGENTLINK_VSCE_TARGET}.vsix"
          unzip -Z1 "releases/agentlink-ci-${AGENTLINK_VSCE_TARGET}.vsix" \
            | node scripts/verify-retrieval-package.mjs \
                --target "$AGENTLINK_VSCE_TARGET"
