name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  cli-package:
    strategy:
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-15
          - target: linux-x64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      AGENTLINK_CLI_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - name: Build standalone CLI preview
        env:
          AGENTLINK_MAC_SIGNING: unsigned
        run: npm run cli:bundle
      - name: Verify packaged CLI launch
        env:
          BUNDLE: cli-releases/agentlink-cli-${{ matrix.target }}
        run: |
          "$BUNDLE/bin/agentlink" --help
          "$BUNDLE/node/bin/AgentLink CLI" --input-type=module -e "await import(\"./$BUNDLE/dist/node_modules/@napi-rs/keyring/index.js\")"
          node apps/cli/smoke-tui.mjs "$BUNDLE/bin/agentlink" --executable --no-color
      - uses: actions/upload-artifact@v7
        with:
          name: agentlink-cli-${{ matrix.target }}-unsigned
          path: cli-releases/*.tar.gz
          if-no-files-found: error

  # Desktop for Linux: the AppImage and deb, built natively per architecture
  # (LanceDB and the keyring come from the runner's node_modules), then the
  # deb installed and launched with Ubuntu's userns restriction on to check
  # its AppArmor profile keeps Chromium's renderer sandbox. Unpublished.
  desktop-linux:
    strategy:
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
      - name: Install apply-seccomp build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc libseccomp-dev
      - run: npm ci
      - run: node scripts/build-apply-seccomp.mjs --target ${{ matrix.target }}
      - name: Package AppImage and deb
        env:
          AGENTLINK_APPLY_SECCOMP_REQUIRED: "1"
        run: npm run desktop:package -- --target ${{ matrix.target }}
      - name: Install and launch the deb
        run: bash scripts/smoke-desktop-deb.sh desktop-releases/AgentLink-Desktop-*-${{ matrix.target }}.deb
      - uses: actions/upload-artifact@v7
        with:
          name: agentlink-desktop-${{ matrix.target }}-unsigned
          path: |
            desktop-releases/AgentLink-Desktop-*.AppImage
            desktop-releases/AgentLink-Desktop-*.deb
          if-no-files-found: error

  # The standalone assistant server on Linux, where it is deployed: its own
  # lint and tests (including the real-process and command-worker tests),
  # then both container images built and smoke-tested under Docker Compose.
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm

      - run: npm ci
      - name: Build workspaces and the server bundle
        run: npm run build:workspaces
      - name: Lint apps/server
        run: npm run lint --workspace apps/server
      - name: Test apps/server
        run: npm test --workspace apps/server

      - name: Build container images
        run: |
          docker build -t agentlink-assistant:local \
            -f apps/server/deploy/container/Dockerfile apps/server
          docker build --target command-worker -t agentlink-command-worker:local \
            -f apps/server/deploy/container/Dockerfile apps/server
      - name: Smoke-test the container deployment
        run: apps/server/deploy/container/smoke-test.sh

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm

      - name: Install shells used by terminal tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zsh
          /bin/bash --version | head -1
          /bin/zsh --version

      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - name: Verify packed core SDK consumer
        run: npm run test:core-sdk-consumer

      - name: Build apply-seccomp
        run: |
          sudo apt-get install -y --no-install-recommends gcc libseccomp-dev
          node scripts/build-apply-seccomp.mjs --target linux-x64

      - name: Package and verify a Linux VSIX
        env:
          AGENTLINK_VSCE_TARGET: linux-x64
          AGENTLINK_APPLY_SECCOMP_REQUIRED: "1"
        run: |
          mkdir -p releases
          npm run package -- "releases/agentlink-ci-${AGENTLINK_VSCE_TARGET}.vsix"
          unzip -Z1 "releases/agentlink-ci-${AGENTLINK_VSCE_TARGET}.vsix" \
            | node scripts/verify-retrieval-package.mjs \
                --target "$AGENTLINK_VSCE_TARGET"
